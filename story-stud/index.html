<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>朝代皇帝世系</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "KaiTi", "STKaiti", "Microsoft YaHei", "SimHei", serif;
            background: linear-gradient(135deg, #fdf6e3 0%, #f5e6d3 50%, #fdf2e9 100%);
            color: #3d2914;
            padding: 50px 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(188, 74, 60, 0.04) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(45, 80, 120, 0.04) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .decor-top {
            width: 100%;
            max-width: 900px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 25px;
            gap: 20px;
            position: relative;
            z-index: 1;
        }

        .decor-line {
            flex: 1;
            height: 1px;
            background: linear-gradient(to right, transparent, #b8483e, transparent);
        }

        .decor-icon {
            width: 40px;
            height: 40px;
        }

        .main-title {
            text-align: center;
            font-size: 52px;
            font-weight: bold;
            margin-bottom: 15px;
            letter-spacing: 20px;
            color: #8b3a2f;
            text-shadow: 2px 2px 4px rgba(139, 58, 47, 0.15);
            position: relative;
            z-index: 1;
            padding-left: 20px;
        }

        .subtitle {
            font-size: 18px;
            color: #9c7a5b;
            letter-spacing: 8px;
            margin-bottom: 50px;
            position: relative;
            z-index: 1;
        }

        .dynasties {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 35px;
            max-width: 900px;
            position: relative;
            z-index: 1;
        }

        .dynasty-card {
            background: linear-gradient(145deg, #fff9f0 0%, #fff5e8 100%);
            border: 2px solid #d4a574;
            border-radius: 4px;
            padding: 30px 25px;
            text-align: center;
            text-decoration: none;
            color: #3d2914;
            cursor: pointer;
            display: block;
            position: relative;
            overflow: hidden;
            box-shadow: 
                0 4px 20px rgba(139, 90, 43, 0.1),
                inset 0 1px 0 rgba(255, 255, 255, 0.8);
            transition: all 0.3s ease;
        }

        .dynasty-card::before {
            content: '';
            position: absolute;
            top: 8px;
            left: 8px;
            right: 8px;
            bottom: 8px;
            border: 1px solid rgba(212, 165, 116, 0.4);
            border-radius: 2px;
            pointer-events: none;
        }

        .dynasty-card:hover {
            transform: translateY(-6px);
            box-shadow: 
                0 12px 35px rgba(139, 90, 43, 0.18),
                inset 0 1px 0 rgba(255, 255, 255, 0.8);
            border-color: #b8483e;
        }

        .dynasty-card:hover::before {
            border-color: rgba(184, 72, 62, 0.5);
        }

        .dynasty-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 18px;
        }

        .dynasty-name {
            font-size: 48px;
            font-weight: bold;
            letter-spacing: 12px;
            margin-bottom: 12px;
            padding-bottom: 10px;
            color: #8b3a2f;
            position: relative;
            padding-left: 12px;
        }

        .dynasty-name::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 2px;
            background: linear-gradient(to right, transparent, #d4a574, transparent);
        }

        .dynasty-period {
            font-size: 15px;
            margin-bottom: 15px;
            color: #7a5c3e;
            letter-spacing: 2px;
            font-weight: 500;
        }

        .dynasty-count {
            font-size: 14px;
            color: #8b6b4d;
            line-height: 1.6;
        }

        .dynasty-count strong {
            color: #b8483e;
            font-size: 22px;
            font-weight: bold;
            margin: 0 3px;
        }

        .corner-decor {
            position: absolute;
            width: 24px;
            height: 24px;
            border-color: #d4a574;
            border-style: solid;
            border-width: 0;
        }

        .dynasty-card:hover .corner-decor {
            border-color: #b8483e;
        }

        .corner-tl {
            top: 12px;
            left: 12px;
            border-top-width: 2px;
            border-left-width: 2px;
        }

        .corner-tr {
            top: 12px;
            right: 12px;
            border-top-width: 2px;
            border-right-width: 2px;
        }

        .corner-bl {
            bottom: 12px;
            left: 12px;
            border-bottom-width: 2px;
            border-left-width: 2px;
        }

        .corner-br {
            bottom: 12px;
            right: 12px;
            border-bottom-width: 2px;
            border-right-width: 2px;
        }

        .footer {
            margin-top: 60px;
            font-size: 14px;
            color: #8b6b4d;
            text-align: center;
            line-height: 2;
            position: relative;
            z-index: 1;
            letter-spacing: 3px;
        }

        .footer-seal {
            margin-top: 20px;
            font-size: 16px;
            color: #b8483e;
            letter-spacing: 6px;
            font-weight: bold;
            padding: 8px 20px;
            border: 2px solid #b8483e;
            display: inline-block;
            transform: rotate(-2deg);
            opacity: 0.8;
        }

        @media (max-width: 768px) {
            .dynasties {
                grid-template-columns: 1fr;
            }
            .main-title {
                font-size: 36px;
                letter-spacing: 12px;
            }
        }
    </style>
</head>
