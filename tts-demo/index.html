<!DOCTYPE html>

<title>火山引擎 TTS（V3 双向流式）试听 Demo</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;

  select, input[type="text"], input[type="password"] {

    border-radius: 8px; font-size: 14px; background: #fff;
  }
  input[type="range"] { width: 100%; }
  .val { font-size: 12px; color: #86909c; }
  button {
    padding: 10px 16px; border: none; border-radius: 10px;
    font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .primary { background: #165dff; color: #fff; width: 100%; }
  .danger { background: #ffece8; color: #d4380d; width: 100%; margin-top: 8px; }
  button:active { opacity: .8; }
  .samples { display: flex; flex-direction: column; gap: 8px; }
  .sample {
    text-align: left; background: #f7f8fa; border: 1px solid #e5e6eb;
    border-radius: 10px; padding: 10px 12px; font-size: 14px; cursor: pointer;
    width: 100%; font-weight: 400;
  }
  .sample small { display: block; color: #86909c; font-size: 11px; margin-bottom: 2px; }
  .sample.active { border-color: #165dff; background: #eef4ff; }
  .status { font-size: 12px; color: #86909c; margin-top: 10px; min-height: 18px; word-break: break-all; }
  .warn { color: #d4380d; }
  .hint { font-size: 11px; color: #86909c; margin-top: 6px; }
  .stats { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .stat { background: #f7f8fa; border-radius: 8px; padding: 4px 10px; font-size: 12px; color: #4e5969; }

</style>
</head>
<body>

<h1>火山引擎 TTS 试听</h1>
<p class="sub">协议：豆包语音 V3 双向流式 WebSocket，经本地代理调用，验证「进题朗读题干」的发音效果与延迟。</p>

<!-- 1. 凭据 -->
<div class="card">
  <h2>1. 凭据（火山引擎控制台）</h2>
  <label>鉴权方式</label>
  <select id="authMode">
    <option value="apikey">新版控制台 · API Key</option>
    <option value="legacy">旧版控制台 · App ID + Access Key</option>
  </select>
  <div id="apiKeyBox">
    <label>API Key（控制台 &gt; API Key 管理）</label>
    <input type="password" id="apiKey" placeholder="your-api-key">
  </div>
  <div id="legacyBox" style="display:none">
    <div class="row" style="display:flex;gap:12px">
      <div style="flex:1">
        <label>App ID</label>
        <input type="text" id="appId" placeholder="如 1234567890">
      </div>
      <div style="flex:1">
        <label>Access Key（应用详情页）</label>
        <input type="password" id="accessKey" placeholder="access token">
      </div>
    </div>
  </div>
  <label class="hint" style="margin-top:10px">
    <input type="checkbox" id="remember" checked style="width:auto"> 记住到 localStorage（仅本机）
  </label>
</div>

<!-- 2. 合成参数 -->
<div class="card">
  <h2>2. 模型与参数</h2>
  <label>Resource ID</label>
  <div class="fixed"><code>seed-tts-2.0</code> · 豆包语音合成大模型 2.0（固定）</div>
  <label>音色 speaker（控制台音色库 · 全部 2.0）</label>
  <select id="speaker"></select>
  <label>语速 speech_rate <span class="val" id="rateVal">1.0x</span></label>
  <input type="range" id="rate" min="0.5" max="2" step="0.05" value="1">
  <label>朗读语种 explicit_language</label>
  <select id="lang">
    <option value="">不指定（默认）</option>
    <option value="zh-cn" selected>zh-cn · 中文为主，支持中英混读</option>
    <option value="en">en · 仅朗读英语</option>
  </select>
</div>

<!-- 3. 试听文本 -->
<div class="card">
  <h2>3. 试听题干（点击选择）</h2>
  <div class="samples" id="samples"></div>
  <label style="margin-top:14px">自定义文本</label>
  <input type="text" id="customText" placeholder="输入任意文本试听…">
</div>

<!-- 4. 播放 -->
<div class="card">
  <h2>4. 播放</h2>
  <button class="primary" id="play">🔊 朗读当前文本</button>
  <button class="danger" id="stop">⏹ 停止（模拟点击答案打断）</button>
  <div class="stats" id="stats"></div>
  <div class="status" id="status"></div>
  <p class="hint">代理带内存缓存：同参数文本只合成一次，重复播放不重复计费。首包延迟 = 收到第一片音频的耗时。</p>
</div>

// ---------- 凭据/表单持久化 ----------
const PERSIST_FIELDS = ['apiKey', 'appId', 'accessKey', 'customText']
const PERSIST_SELECTS = ['authMode', 'speaker', 'lang']
function restore() {
  for (const f of PERSIST_FIELDS) {
    const v = localStorage.getItem('ttsdemo.' + f)
    if (v) $(f).value = v
  }
  for (const s of PERSIST_SELECTS) {
    const v = localStorage.getItem('ttsdemo.' + s)
    if (v !== null) $(s).value = v
  }
}
function persist() {
  if (!$('remember').checked) return
  for (const f of PERSIST_FIELDS) {
    const v = $(f).value.trim()
    if (v) localStorage.setItem('ttsdemo.' + f, v)
    else localStorage.removeItem('ttsdemo.' + f)
  }
  for (const s of PERSIST_SELECTS) localStorage.setItem('ttsdemo.' + s, $(s).value)
}

]

     <small>${s.tag}</small>${s.text}
   </button>`
).join('')
samplesEl.addEventListener('click', e => {
  const btn = e.target.closest('.sample')
  if (!btn) return
  activeSample = SAMPLES[+btn.dataset.i]
  document.querySelectorAll('.sample').forEach(b => b.classList.remove('active'))
  btn.classList.add('active')
  stop()
})
$('customText').addEventListener('input', () => stop())

function currentText() { return $('customText').value.trim() || activeSample.text }

// ---------- 调用与播放 ----------
let currentAudio = null
const statusEl = $('status')
const statsEl = $('stats')

function stop() {
  if (currentAudio) { currentAudio.pause(); currentAudio = null }
  statusEl.textContent = ''
}

$('play').addEventListener('click', async () => {
  persist()
  stop()

  const text = currentText()
  const speaker = $('speaker').value
  if (!speaker) { statusEl.innerHTML = '<span class="warn">请选择音色</span>'; return }

  statusEl.textContent = '合成中…'
  statsEl.innerHTML = ''
  try {
    const r = await fetch('/volc-tts', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        apiKey: $('authMode').value === 'apikey' ? $('apiKey').value.trim() : '',
        appId: $('authMode').value === 'legacy' ? $('appId').value.trim() : '',
        accessKey: $('authMode').value === 'legacy' ? $('accessKey').value.trim() : '',
        resourceId: 'seed-tts-2.0',
        speaker,
        text,
        // 0.5x → -50，1x → 0，2x → 100（官方 speech_rate 定义）
        speechRate: Math.round((+$('rate').value - 1) * 100),
        explicitLanguage: $('lang').value,
      }),
    })
    const data = await r.json()
    if (!r.ok) throw new Error(data.error || `HTTP ${r.status}`)
    statusEl.textContent = '播放中…'
    statsEl.innerHTML = `
      <span class="stat">首包 <b>${data.firstChunkMs}ms</b></span>
      <span class="stat">合成完成 <b>${data.totalMs}ms</b></span>
      <span class="stat">${data.cached ? '<b>缓存命中</b>' : '新合成'}</span>`
    currentAudio = new Audio('data:audio/mp3;base64,' + data.audio)
    currentAudio.onended = () => {
      currentAudio = null
      statusEl.textContent = '播放完毕'
    }
    await currentAudio.play()
  } catch (e) {
    statusEl.innerHTML = `<span class="warn">${e.message}</span>`
  }
})
$('stop').addEventListener('click', stop)
</script>
</body>
</html>
